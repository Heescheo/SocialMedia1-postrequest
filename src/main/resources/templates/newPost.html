<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>New Post</title>
<link rel="stylesheet" th:href="@{/style.css}" href="style.css">
</head>
<body>

<h1>Create New Post</h1>

<form th:action="@{/posts}"
      th:object="${post}"
      method="post"
>

  <label for="title">Title</label>
  <input type="text" id="title" th:field="*{title}" placeholder="Write a headline..." required>

  <label for="content">Content</label>
  <textarea id="content" th:field="*{content}" placeholder="What's on your mind?" required></textarea>

  <label for="date">Date</label>
  <input type="date" id="date" th:field="*{date}" required>

  <div class="radio-group">
    <label>Visibility</label>
    <label>
      <input type="radio" th:field="*{public}" value="true" checked>
      Public
    </label>
    <label>
      <input type="radio" th:field="*{public}" value="false">
      Private
    </label>
  </div>

  <button type="submit">Create Post</button>

</form>

</body>
</html>
